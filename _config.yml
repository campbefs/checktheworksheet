title: "Check the Worksheet"
description: >-
  A line-by-line reproduction in code of the Massachusetts Child Support Guidelines Worksheet
  (form CJ-D 304, 2025 edition), checked against the form's own calculation scripts.
lang: en

# Custom domain served at the root (CNAME: checktheworksheet.org). `url:` is set to the real
# domain so jekyll-seo-tag's absolute/OG URLs and jekyll-sitemap's sitemap.xml resolve correctly.
# `baseurl:` is intentionally NOT set and must never be — a github.io-style subpath baseurl
# breaks every root-relative link on this site (/figures/..., /model/..., /data/...) in
# production even though it works in local preview.
url: "https://checktheworksheet.org"

markdown: kramdown

# No `theme:` / `remote_theme:` — this repo carries its own _layouts/_includes/assets/css/site.css
# (2026-09-06 redesign: "Paper & Claret", see docs/research/website/redesign/2026-09-06-DESIGN-BRIEF.md
# in the private research repo, and CONVENTIONS.md here). Re-adding a `theme:` key silently
# reintroduces that theme's layouts and overrides these files — it happened once already on this
# branch (a prior commit reduced this file to `theme: minima`); don't reintroduce it.

# Contact form (contact/index.md), added 2026-09-11 when the Documents section came down and the
# owner's name/email/GitHub link came off the site — this is the one route left for a reader to
# report an error. The site is static (GitHub Pages), so the form POSTs to a third-party form
# backend; this is the single place that endpoint lives, read by the form's `action` attribute and
# by assets/js/contact.js's fetch call (which reads it off `form.action`, not from here a second
# time). THE PLACEHOLDER BELOW WILL 404 UNTIL REPLACED — everything else (the toast, the no-JS
# fallback landing on the provider's own confirmation, the honeypot) already works once this is a
# real endpoint. Provider comparison and how to get one:
# docs/plans/redteam/CONTACT-FORM.md in the private child-support-reform repo.
contact_form_endpoint: "https://formspree.io/f/REPLACE_WITH_YOUR_FORM_ID"

plugins:
  - jekyll-seo-tag     # {% seo %} in _layouts/default.html: meta/OG tags from front matter + this file
  - jekyll-sitemap     # generates /sitemap.xml (machine-readable). The human-readable /sitemap/
                       # PAGE required by web-page-anatomy (WCAG 2.4.5, a second way to navigate
                       # distinct from the footer) is a separate content page — see CONVENTIONS.md.

# Keeps Jekyll's markdown/HTML converters off files that exist for GitHub's repo browser or for
# internal maintenance, not for the public site. EXACT FILE PATHS only, never a folder that holds
# cited assets (data/, figures/, model/, paper/) — those files are already static pass-throughs
# (Jekyll only ever converts .md/.markdown/.html) and excluding the folder would delete them from
# the built site instead of protecting them; their URLs are cited in a working paper and letters
# that have gone out.
exclude:
  - README.md                     # GitHub repo-browser landing page; index.html is the real homepage
  - index.md                      # stale pre-redesign draft homepage, byte-identical to README.md;
                                   # index.html is the real homepage and would collide with this at
                                   # build time besides, so it must never be served on its own
  - CLAUDE.md                     # agent instructions; already gitignored, listed for local-build parity
  - CONVENTIONS.md                # internal doc for the agents/maintainers building this site
  - context/                      # session memory; already gitignored, listed for local-build parity
  - figures/exhibits/README.md    # was going live at /figures/exhibits/ via jekyll-readme-index
  - figures/working/README.md     # was going live at /figures/working/ via jekyll-readme-index
  - Gemfile
  - Gemfile.lock
  - vendor/                       # local `bundle install` path (see .gitignore) — never on GH Pages,
                                   # excluded anyway for a clean local build
  - node_modules/

# Guards a LOCAL `bundle exec jekyll build` from clobbering asset folders it did not generate, if
# the destination is ever pointed somewhere other than a throwaway _site/. These paths are frozen:
# cited in the working paper and in letters that have already gone out. Never delete, move or
# rename anything under them.
keep_files:
  - data
  - figures
  - model
  - paper
